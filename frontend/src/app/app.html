<div class="topbar">
  <button type="button" class="icon-button" aria-label="Abrir menu" (click)="sidebar.openDrawer()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>
  <a routerLink="/" class="brand">CheckApps</a>
</div>

@if (sidebar.drawerOpen()) {
  <div class="backdrop" (click)="sidebar.closeDrawer()"></div>
}

<div class="layout" [class.collapsed]="sidebar.collapsed()">
  <aside class="sidebar" [class.open]="sidebar.drawerOpen()">
    <div class="sidebar-head">
      <a routerLink="/" class="brand" title="CheckApps" aria-label="CheckApps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        <span class="label">CheckApps</span>
      </a>
      <button
        type="button"
        class="icon-button collapse-toggle"
        [attr.aria-label]="sidebar.collapsed() ? 'Expandir menu' : 'Recolher menu'"
        [attr.aria-expanded]="!sidebar.collapsed()"
        [title]="sidebar.collapsed() ? 'Expandir menu' : 'Recolher menu'"
        (click)="sidebar.toggleCollapsed()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (sidebar.collapsed()) {
            <path d="M9 6l6 6-6 6" />
          } @else {
            <path d="M15 6l-6 6 6 6" />
          }
        </svg>
      </button>
    </div>

    <div class="squad-switcher">
      <button type="button" class="nav-item squad-icon" title="Squad: escolher" aria-label="Squad: escolher" (click)="sidebar.setCollapsed(false)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 100-6 3 3 0 000 6zM8 11a3 3 0 100-6 3 3 0 000 6zM2 19c0-2.8 2.7-4 6-4s6 1.2 6 4M14 15.2c.6-.1 1.300-.2 2-.2 3.300 0 6 1.200 6 4" /></svg>
        </button>
        <label>
          <span>Squad</span>
          <select aria-label="Trocar de squad" [value]="currentSquad.squadId() ?? ''" (change)="switchSquad($any($event.target).value)">
            @if (!currentSquad.squadId()) {
              <option value="" disabled>Escolha uma squad…</option>
            }
            @for (squad of currentSquad.squads(); track squad.id) {
              <option [value]="squad.id" [selected]="squad.id === currentSquad.squadId()">
                {{ squad.name }}{{ squad.status === 'inactive' ? ' (inativa)' : '' }}
              </option>
            }
          </select>
        </label>
    </div>

    <nav aria-label="Navegação principal">
      <a routerLink="/squads" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Squads" aria-label="Squads">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 100-6 3 3 0 000 6zM8 11a3 3 0 100-6 3 3 0 000 6zM2 19c0-2.800 2.700-4 6-4s6 1.200 6 4M14 15.200c.6-.1 1.300-.2 2-.2 3.300 0 6 1.200 6 4" /></svg>
        <span class="label">Squads</span>
      </a>
      <a routerLink="/apps" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Apps" aria-label="Apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
        <span class="label">Apps</span>
      </a>
      <a routerLink="/repositories" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Repositórios" aria-label="Repositórios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v10M7 14a3 3 0 100 6 3 3 0 000-6zM7 4a2 2 0 100 .1M17 8a2 2 0 100 .1M17 8c0 4-4 4-10 6" /></svg>
        <span class="label">Repositórios</span>
      </a>
      <a routerLink="/packages" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Pacotes" aria-label="Pacotes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.500v9L12 21l-8-4.500v-9L12 3zM12 12l8-4.500M12 12v9M12 12L4 7.500" /></svg>
        <span class="label">Pacotes</span>
      </a>
      <a routerLink="/integrations" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Integrações" aria-label="Integrações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a3 3 0 100-6 3 3 0 000 6zM18 21a3 3 0 100-6 3 3 0 000 6zM6 9v3a3 3 0 003 3h6" /></svg>
        <span class="label">Integrações</span>
      </a>
      <a routerLink="/map" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Mapa" aria-label="Mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6a2 2 0 100-4 2 2 0 000 4zM19 6a2 2 0 100-4 2 2 0 000 4zM12 22a2 2 0 100-4 2 2 0 000 4zM5 6v3a3 3 0 003 3h8a3 3 0 003-3V6M12 12v6" /></svg>
        <span class="label">Mapa</span>
      </a>
      <a routerLink="/journeys" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Jornadas" aria-label="Jornadas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.500 4 2.500 4H5" /></svg>
        <span class="label">Jornadas</span>
      </a>
      <a routerLink="/checks" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" title="Checagens" aria-label="Checagens">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3.500 6l1.500 1.500L7.500 5M3.500 12l1.500 1.500L7.500 11M3.500 18l1.500 1.500L7.500 17" /></svg>
        <span class="label">Checagens</span>
      </a>
    </nav>
  </aside>

  <div class="content">
    <router-outlet />
  </div>
</div>
